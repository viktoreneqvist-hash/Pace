name: Feature request
description: Propose a focused improvement to Pace
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Pace solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, coaching, or architecture trade-offs
      description: Note any new external data flow, persistent state, or coaching-policy decision.
