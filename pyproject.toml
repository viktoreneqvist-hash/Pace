[project]
name = "pace"
version = "0.1.0a1"
description = "A private, local-first endurance coaching system."
readme = "README.md"
license = "MIT"
authors = [{ name = "Viktor Eneqvist" }]
keywords = ["garmin", "running", "cycling", "endurance", "ai-coach", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.115.0",
    "garminconnect[workout]==0.3.16",
    "itsdangerous>=2.2.0",
    "openai>=2.0.0",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pace = "pace.cli.app:main"

[project.urls]
Homepage = "https://github.com/viktoreneqvist-hash/Pace"
Repository = "https://github.com/viktoreneqvist-hash/Pace.git"
Issues = "https://github.com/viktoreneqvist-hash/Pace/issues"
Documentation = "https://github.com/viktoreneqvist-hash/Pace/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/pace"]
