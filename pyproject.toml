[project]
name = "pace"
version = "0.1.0"
description = "A private, local-first endurance coaching system."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "garminconnect==0.3.6",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pace = "pace.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pace"]
